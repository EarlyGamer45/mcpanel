# Minecraft Hosting Platform - Nginx vhost (installed by deploy/install.sh
# and deploy/set-address.sh, see deploy/lib/address.sh)
# managed-by: mcpanel deploy/lib/address.sh
#
# Placeholders replaced by the installer:
#   __SERVER_NAME__   domain (panel.example.com) or IPv4 address; "_" for IPv6
#   __HTTP_PORT__     HTTP port (80 by default)
#   __LISTEN_FLAGS__  " default_server" in IP mode when no other site claims it
#   __APP_DIR__ / __PHP_FPM_SOCK__ / __ADMIN_PATH__
#
# With HTTPS_MODE=letsencrypt certbot adds the 443 server block and the
# HTTP -> HTTPS redirect to this file.

server {
    listen __HTTP_PORT____LISTEN_FLAGS__;
    listen [::]:__HTTP_PORT____LISTEN_FLAGS__;
    server_name __SERVER_NAME__;

    root __APP_DIR__/public;
    index index.php;

    client_max_body_size 20m;
    server_tokens off;

    # Health endpoint never goes through PHP-FPM for the static part but is
    # handled by the app; keep the location generic below.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Never serve dotfiles, the .env, storage or source trees.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ^/(storage|bootstrap|src|config|database|lang|resources|tests|deploy|docs|bin)/ {
        deny all;
        return 404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /client\nDisallow: /__ADMIN_PATH__\n";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # The CSP is also sent by the application; keep this in sync if you add
    # external CDNs. 'unsafe-inline' covers the existing inline style/confirm
    # attributes; connect-src allows the Pterodactyl console websocket.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/mcpanel.access.log;
    error_log  /var/log/nginx/mcpanel.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
