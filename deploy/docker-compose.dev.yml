# Local development services only (NOT production: production uses the native
# MariaDB/Nginx/PHP-FPM stack installed by deploy/install.sh).
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   DB_DRIVER=mysql DB_HOST=127.0.0.1 DB_PORT=3307 DB_DATABASE=mchosting \
#     DB_USERNAME=mchosting DB_PASSWORD=mchosting php bin/console migrate
#
# Mailpit UI: http://localhost:8025 — set MAIL_DRIVER=smtp, MAIL_HOST=127.0.0.1,
# MAIL_PORT=1025, MAIL_ENCRYPTION=none to see outgoing email locally.

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mchosting
      MARIADB_USER: mchosting
      MARIADB_PASSWORD: mchosting
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  db-data:
